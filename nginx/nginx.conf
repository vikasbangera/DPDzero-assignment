log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    access_log /var/log/nginx/access.log custom;

    # Service 1 routing
    location /service1/ {
        proxy_pass http://service_1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Direct access to service1 endpoints
    location /service1/ping {
        proxy_pass http://service_1:8001/ping;
    }

    location /service1/hello {
        proxy_pass http://service_1:8001/hello;
    }

    # Service 2 routing
    location /service2/ {
        proxy_pass http://service_2:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Direct access to service2 endpoints
    location /service2/ping {
        proxy_pass http://service_2:8002/ping;
    }

    location /service2/hello {
        proxy_pass http://service_2:8002/hello;
    }

    # Health check endpoint for nginx
    location /health {
        access_log off;
        return 200 "Nginx is healthy\n";
    }

    # Root route - simple welcome page
    location / {
        return 200 'Welcome to the API Gateway. Use /service1 or /service2 to access the respective services.';
        add_header Content-Type text/plain;
    }
}